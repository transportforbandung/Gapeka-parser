# Publish the simulator website (web/) to GitHub Pages.
# Builds the app + engine worker, copies the committed data package (dist/<edition>), runs the engine tests
# (golden replay, re-planning test, dispatch; no Python needed) and deploys only when they pass.
name: Publish website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "engine/**"
      - "dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Install
        working-directory: engine
        run: npm ci
      - name: Engine tests (must equal the Python goldens)
        working-directory: engine
        run: npm test
      - name: Build website
        working-directory: engine
        run: npm run web
      - name: Stage site
        run: |
          mkdir -p _site
          cp web/index.html web/style.css _site/
          cp -r web/build web/data _site/
          rm -f _site/build/*.map
          touch _site/.nojekyll
          ls -la _site _site/build _site/data/*
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
